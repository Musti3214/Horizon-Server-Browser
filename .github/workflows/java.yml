name: Build Fabric and Forge
on:
  push:
    branches: [main]
    paths: ['java/**', '.github/workflows/java.yml']
  pull_request:
    paths: ['java/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both loaders and run file/protocol integration checks
        working-directory: java
        run: sh gradlew --console=plain :fabric:build :forge:build
