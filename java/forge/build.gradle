plugins { id 'java'; id 'net.minecraftforge.gradle' version '7.0.40' }
apply from: '../gradle/self-tests.gradle'
base { archivesName = 'server-browser-forge' }
java {
    disableAutoTargetJvm()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies { implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.5') }
minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            mods { register('server_browser') { source sourceSets.main } }
            args '--width', '1920', '--height', '1080'
            // Development directories do not have the distribution JAR's manifest.
            args '-mixin.config=server-browser.mixins.json'
        }
        register('client')
    }
}
tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = "21"
    targetCompatibility = "21"
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand(version: project.version) }
}
jar {
    from('../LICENSE') { rename { 'LICENSE' } }
    from('../THIRD-PARTY.md')
    manifest { attributes('MixinConfigs': 'server-browser.mixins.json', 'Implementation-Version': project.version, 'Minecraft-Version': '26.3') }
}
