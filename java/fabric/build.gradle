plugins { id 'net.fabricmc.fabric-loom' version '1.19.3' }
apply from: '../gradle/self-tests.gradle'
base { archivesName = 'server-browser-fabric' }
java {
    disableAutoTargetJvm()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    // Forge's upstream Mixin 0.8.7 accepts Java 21 mixin bytecode. Runtime remains Java 25.
    withSourcesJar()
}
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api-base:2.0.6+fcdff87f5d'
    implementation 'net.fabricmc.fabric-api:fabric-resource-loader-v1:3.1.0+5af7744b5d'
    include 'net.fabricmc.fabric-api:fabric-api-base:2.0.6+fcdff87f5d'
    include 'net.fabricmc.fabric-api:fabric-resource-loader-v1:3.1.0+5af7744b5d'
}
tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = "21"
    targetCompatibility = "21"
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
jar {
    from('../LICENSE') { rename { 'LICENSE' } }
    from('../THIRD-PARTY.md')
    manifest { attributes('Implementation-Version': project.version, 'Minecraft-Version': '26.3') }
}
